<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https://image.civitai.com https://*.civitai.com https://*.civitai.red; media-src 'self' https://image.civitai.com https://*.civitai.com https://*.civitai.red">
  <title>Civitai Sync GUI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Civitai Sync</h1>
    <div class="user" id="userInfo">未登录</div>
  </header>

  <section class="card">
    <h2>设置</h2>
    <label>API Key
      <div class="row">
        <input type="password" id="apiKey" placeholder="civitai.red 的 API key" />
        <button id="toggleKey">显示</button>
        <button id="verifyKey">验证</button>
      </div>
    </label>

    <label>下载根目录
      <div class="row">
        <input type="text" id="downloadDir" readonly />
        <button id="pickFolder">选择</button>
        <button id="openFolder">打开</button>
      </div>
    </label>

    <div class="row">
      <button id="saveConfig" class="primary">保存设置</button>
      <span id="saveStatus" class="hint"></span>
    </div>
  </section>

  <section class="card">
    <h2>批量下载</h2>
    <p class="hint">每行一个链接。支持:<code>/posts/&lt;id&gt;</code>、<code>/models/&lt;id&gt;</code>、<code>/images/&lt;id&gt;</code></p>
    <textarea id="urlInput" rows="6" placeholder="https://civitai.red/posts/123
https://civitai.red/models/456
https://civitai.red/images/789"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="previewBtn" class="primary">预览 / 刷新</button>
      <button id="clearBtn">清空</button>
      <span id="urlCount" class="hint"></span>
    </div>
  </section>

  <section class="card" id="previewCard" style="display:none">
    <h2>预览队列 <span id="queueSummary" class="hint"></span></h2>
    <div id="queueList" class="queue-list"></div>
    <div class="row" style="margin-top:12px">
      <button id="startBtn" class="primary">开始下载全部</button>
      <button id="cancelBtn" disabled>取消</button>
    </div>
  </section>

  <section class="card">
    <h2>进度</h2>
    <div class="progress-wrap">
      <div class="progress-row"><span>总体</span><span id="batchText" class="hint">等待开始</span></div>
      <div class="progress-bar"><div id="batchFill"></div></div>

      <div class="progress-row" style="margin-top:10px"><span>当前文件</span><span id="fileText" class="hint">—</span></div>
      <div class="progress-bar"><div id="fileFill"></div></div>
      <div id="bytesText" class="hint" style="margin-top:4px">—</div>
    </div>
    <pre id="log"></pre>
  </section>

  <script src="app.js"></script>
</body>
</html>
