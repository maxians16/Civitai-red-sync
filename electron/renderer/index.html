<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https://image.civitai.com https://*.civitai.com https://*.civitai.red; media-src 'self' https://image.civitai.com https://*.civitai.com https://*.civitai.red">
  <title>Civitai Sync GUI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Civitai Sync</h1>
    <div class="user" id="userInfo">未登录</div>
  </header>

  <section class="card">
    <h2>设置</h2>
    <label>API Key
      <div class="row">
        <input type="password" id="apiKey" placeholder="civitai.red 的 API key" />
        <button id="toggleKey">显示</button>
        <button id="verifyKey">验证</button>
      </div>
    </label>

    <label>下载根目录
      <div class="row">
        <input type="text" id="downloadDir" readonly />
        <button id="pickFolder">选择</button>
        <button id="openFolder">打开</button>
      </div>
    </label>

    <div class="row">
      <button id="saveConfig" class="primary">保存设置</button>
      <span id="saveStatus" class="hint"></span>
    </div>
  </section>

  <section class="card">
    <h2>自定义下载</h2>
    <p class="hint">粘贴 Civitai 链接,支持:<code>/posts/&lt;id&gt;</code>、<code>/models/&lt;id&gt;</code>、<code>/images/&lt;id&gt;</code></p>
    <div class="row">
      <input type="text" id="urlInput" placeholder="https://civitai.red/posts/123456" />
      <button id="previewBtn" class="primary">预览</button>
    </div>
    <div id="parsedInfo" class="hint"></div>
  </section>

  <section class="card" id="previewCard" style="display:none">
    <h2>预览</h2>
    <div id="previewMeta" class="preview-meta"></div>

    <div id="versionSelectWrap" style="display:none; margin:10px 0;">
      <label>版本
        <select id="versionSelect"></select>
      </label>
    </div>

    <div id="previewItems" class="preview-grid"></div>
    <div id="fileList" class="file-list"></div>

    <label style="margin-top:12px">下载到子文件夹(相对根目录)
      <div class="row">
        <input type="text" id="subfolderInput" placeholder="自动" />
      </div>
    </label>

    <div class="row" style="margin-top:12px">
      <button id="startBtn" class="primary">开始下载</button>
      <button id="cancelBtn" disabled>取消</button>
      <span id="previewSummary" class="hint"></span>
    </div>
  </section>

  <section class="card">
    <h2>进度</h2>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <div id="progressText" class="hint">等待开始</div>
    </div>
    <pre id="log"></pre>
  </section>

  <script src="app.js"></script>
</body>
</html>
